[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sclpll-language-server"
version = "1.0.1"
description = "Launcher for the canonical SCLPL language server"
requires-python = ">=3.11"
dependencies = [
    "sclpl @ https://github.com/sm408/sclpl-api/releases/download/v1.0.1/sclpl-1.0.1-py3-none-any.whl",
    "pygls>=2.1,<3",
]

[project.scripts]
sclpll-language-server = "sclpll_language_server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sclpll_language_server"]
