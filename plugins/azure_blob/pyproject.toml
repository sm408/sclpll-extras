[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sclpl-azure-blob"
version = "0.9.1"
description = "Azure Blob Storage resource provider for SCLPL"
requires-python = ">=3.11"
dependencies = [
    "sclpl>=0.9.1,<0.10",
    "azure-identity>=1.17,<2",
    "azure-storage-blob>=12.22,<13",
]

[project.entry-points."sclpl.plugins"]
azure_blob = "azure_blob"

[tool.hatch.build.targets.wheel]
packages = ["azure_blob"]
