[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sclpll-language-server"
version = "0.0.0"
description = "Launcher for the canonical SCLPL language server"
requires-python = ">=3.11"
dependencies = [
    "sclpl>=0.9.1,<0.10",
    "pygls>=2.1,<3",
]

[project.scripts]
sclpll-language-server = "sclpll_language_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sclpll_language_server"]
