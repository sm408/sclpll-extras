[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sclpl-feeds"
version = "1.0.1"
description = "RSS and Atom feed functions for SCLPL"
requires-python = ">=3.11"
dependencies = [
    "sclpl>=1.0.1,<1.1",
    "defusedxml>=0.7,<1",
    "httpx>=0.27,<1",
]

[project.entry-points."sclpl.plugins"]
feeds = "feeds"

[tool.hatch.build.targets.wheel]
packages = ["feeds"]

# SCLPL looks for an installed plugin's manifest at `<entry-point name>/plugin.toml`,
# so ship it inside the package; the editor reads it without importing plugin code.
[tool.hatch.build.targets.wheel.force-include]
"plugin.toml" = "feeds/plugin.toml"

# Same lint settings as the core, so the plugin reads like the code it extends.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["feeds"]

# Neither sclpl nor defusedxml ships type information (no py.typed), so the
# connector decorators are untyped from mypy's point of view.
[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*", "sclpl", "sclpl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["feeds"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
